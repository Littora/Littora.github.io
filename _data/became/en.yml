faqs:
  - question: "What belongs in Became?"
    answer: "Significant achievements, turning points, and life events: a graduation, a career milestone, a relationship, a meaningful experience, or a decision that changed your direction. Choose what deserves a lasting record."
  - question: "Do I have to use AI?"
    answer: "No. You can write, edit, save, and choose a presentation yourself. Add your own photo, keep the designed cover, or choose optional AI refinement and illustration."
  - question: "Can I use Became offline?"
    answer: "Manual recording, your saved collection, and presentation choices work offline. AI generation and App Store purchases or restoration need an internet connection."
  - question: "Where are my records kept?"
    answer: "Your records and photos stay in the app on your device and are included in its device backup. You can also export and import a Became backup in Settings. Became does not require an account or provide cloud collection sync."
  - question: "Which devices and languages are supported?"
    answer: "Became is designed for iPhone with iOS 17 or later. The app supports English, German, French, Italian, Japanese, Korean, and Norwegian Bokmål."
