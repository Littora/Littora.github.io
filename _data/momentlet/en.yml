seo:
  title: "Momentlet — turn your moments into art"
  description: "Describe a moment, choose how it should feel, and turn it into an AI-generated image you can keep, revisit, save, or share."

nav:
  how: "How it works"
  styles: "Visual feelings"
  library: "Your Moments"
  premium: "Premium"
  faq: "FAQ"
  download: "Download"

hero:
  eyebrow: "A new way to keep a moment"
  title: "Keep how it felt."
  body: "Describe a moment in your own words. Choose a visual feeling. Momentlet turns it into one image worth keeping."
  primary: "Download for iPhone"
  secondary: "See how it works"
  note: "Start with 3 creations · No account required · Designed for iOS 17+"
  preview_label: "Illustrative Moment · Natural"
  preview_description: "Coffee after the rain, when the clouds opened just enough for the sea to catch the light."

opening:
  eyebrow: "For the moments the camera missed"
  title: "Some things are remembered as a feeling before they become a picture."
  body: "Momentlet begins there. You bring the detail that matters—the weather, the light, who was beside you, or the part you cannot quite photograph. Momentlet gives it visual form without asking you to learn prompt language."

how:
  eyebrow: "A simple creative rhythm"
  title: "From a few words to a Moment."
  body: "One focused path keeps the experience light, clear, and personal."
  steps:
    - number: "01"
      title: "Describe what happened"
      body: "Write naturally. A place, a small detail, a person, the light, or simply how the scene stayed with you."
    - number: "02"
      title: "Choose how it should feel"
      body: "Pick one of six visual feelings—from honest and natural to softly painted, dreamlike, or nostalgic."
    - number: "03"
      title: "Keep the image"
      body: "Your finished Moment joins a local library with its original description, visual feeling, and date."

styles:
  eyebrow: "Visual feelings"
  title: "Direction without a control panel."
  body: "Each feeling gives your Moment a distinct visual language while keeping the choice understandable."
  items:
    - id: natural
      name: "Natural"
      note: "True to life"
      access: "Included"
    - id: cinematic
      name: "Cinematic"
      note: "Light and depth"
      access: "Included"
    - id: editorial
      name: "Editorial"
      note: "Clean and refined"
      access: "Included"
    - id: watercolor
      name: "Watercolor"
      note: "Soft and painted"
      access: "Premium"
    - id: dreamlike
      name: "Dreamlike"
      note: "Luminous and surreal"
      access: "Premium"
    - id: nostalgic
      name: "Nostalgic"
      note: "Warm film memory"
      access: "Premium"

library:
  eyebrow: "A place to return"
  title: "Not a stream of outputs. A library of your Moments."
  body: "Every successful creation keeps the picture together with the words and feeling that shaped it. Return to it later, mark a favorite, save it to Photos, or share it your way."
  points:
    - "Stored in your local Moment library"
    - "Original description, visual feeling, and date kept together"
    - "Favorite, save, share, or delete an individual Moment"

premium:
  eyebrow: "Momentlet Premium"
  title: "More room for the moments that matter."
  body: "The complete creative rhythm for people who want to keep making—not a maze of credits or hidden limits."
  free_title: "Start free"
  free_body: "3 successful creations"
  free_note: "Natural, Cinematic, and Editorial"
  paid_title: "Create with Premium"
  paid_body: "100 successful creations each subscription month"
  paid_note: "Every current visual feeling and new Premium styles as they arrive"
  price_note: "Current U.S. reference prices: $6.99 monthly or $39.99 yearly. Your App Store shows the final local price before purchase."

privacy:
  eyebrow: "Clear before you create"
  title: "Your words shape the image. You decide when they are sent."
  body: "Before the first real generation, Momentlet explains that your description and chosen style are sent to the image service and its AI providers. You can allow or withdraw image processing in More. Finished Moments stay in the local library on your device."
  note: "Momentlet does not currently provide cloud sync or cross-device recovery for your Moment library."

faq:
  eyebrow: "Questions, answered"
  title: "Before you make your first Moment."
  items:
    - question: "Do I need to know how to write an AI prompt?"
      answer: "No. Describe the moment in your own words. Momentlet combines your description with the visual feeling you choose."
    - question: "Will the image match my memory exactly?"
      answer: "Not always. AI-generated images are visual interpretations and may change or omit people, objects, text, or small details."
    - question: "Can I try Momentlet without subscribing?"
      answer: "Yes. You can complete up to three successful creations with Natural, Cinematic, and Editorial."
    - question: "What does Premium include?"
      answer: "Premium includes up to 100 successful creations per subscription month, every current visual feeling, and new Premium styles as they arrive."
    - question: "Does a failed generation use my allowance?"
      answer: "No. A creation counts only after a valid image is successfully saved to your local Moment library."
    - question: "Where are my Moments stored?"
      answer: "Your finished Moment library is stored locally on this device. Momentlet does not currently provide cloud sync, backup, or cross-device recovery."

closing:
  eyebrow: "Your next Moment"
  title: "What would you keep?"
  body: "A quiet morning. A road after rain. The last light of a trip. Start with what happened—Momentlet will help make it visible."
  primary: "Download for iPhone"
  secondary: "Contact Littora"

download_modal:
  eyebrow: "Momentlet for iPhone"
  title: "Almost ready for the App Store."
  body: "Momentlet is being prepared for App Store review. Downloads will open here as soon as the release is available."
  close: "Got it"
  support: "Contact support"
