faq:
  title: "Before you make your first Moment."
  items:
    - question: "Do I need to know how to write an AI prompt?"
      answer: "No. Describe the moment in your own words. Momentlet combines your description with the visual feeling you choose."
    - question: "Will the image match my memory exactly?"
      answer: "Not always. AI-generated images are visual interpretations and may change or omit people, objects, text, or small details."
    - question: "Can I try Momentlet without subscribing?"
      answer: "Yes. You can complete up to three successful creations with Natural, Cinematic, and Editorial."
    - question: "What does Premium include?"
      answer: "Premium includes up to 100 successful creations per subscription month, every current visual feeling, and new Premium styles as they arrive."
    - question: "Does a failed generation use my allowance?"
      answer: "No. A creation counts only after a valid image is successfully saved to your local Moment library."
    - question: "Where are my Moments stored?"
      answer: "Your finished Moment library is stored locally on this device. Momentlet does not currently provide cloud sync, backup, or cross-device recovery."

closing:
  title: "What would you keep?"
  body: "A quiet morning. A road after rain. The last light of a trip. Start with what happened—Momentlet will help make it visible."
