faq:
  - question: "Does WidgetFlair work offline?"
    answer: "Yes. Browsing, editing, saving, and using your widgets work offline. Purchasing or restoring Premium uses Apple’s App Store and needs an internet connection. An iCloud-only photo may also need to download before you can use it offline."
  - question: "What’s included for free?"
    answer: "Start with Studio clock, Soft digital, Calendar tile, Little note, Small victories, Water ritual, Gratitude jar, Pocket companion, Daily perspective, and A little more today. Every palette and Home Screen size is available, and you can preview the full collection for free."
  - question: "What does Premium unlock?"
    answer: "Create and customize every design in the full collection, including illustrated clocks, reading progress, playful choices, mood flowers, habit gardens, and more. Premium also includes new Premium designs added while your subscription is active. We’ll continue expanding the collection; we don’t promise a fixed release schedule."
  - question: "How do I put a widget on my Home Screen?"
    answer: "Save your design in WidgetFlair first. Touch and hold your Home Screen, tap Edit → Add Widget (or +), and choose WidgetFlair. Then touch and hold the added widget, tap Edit Widget, and choose your saved design. Saving inside the app does not add a widget automatically."
  - question: "Can I use widgets on my Lock Screen?"
    answer: "Compatible designs support inline, circular, and rectangular Lock Screen formats. Available formats depend on the design and your device; the app’s setup guide shows which designs are compatible."
  - question: "Can I interact with my widgets?"
    answer: "Compatible designs let you log water, check off a priority, mark a habit, start a focus timer, record a mood, turn a reading page, or pick a little adventure. Some entries, such as writing a gratitude note, are edited inside the app. iOS controls widget refresh timing."
  - question: "What happens if I stop subscribing to Premium?"
    answer: "Your saved designs stay in your library, keep working offline, and remain editable. An active Premium subscription is needed to create new Premium designs."
  - question: "Which devices and languages are supported?"
    answer: "WidgetFlair supports iPhone with iOS 17 or later. Choose English, German, French, Italian, Japanese, Korean, or Norwegian Bokmål in My widgets → Settings → App language, or follow your system language."
