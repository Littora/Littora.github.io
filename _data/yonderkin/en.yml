    - { id: "orin", label: "A horse’s-eye view", name: "Orin", kind: "Steppe horse", body: "Compare maps with a horse who navigates by grass, wind, gates, and the habits of dogs.", image: "/assets/yonderkin/orin.jpg", alt: "Orin, a chestnut steppe horse, standing in pale grass" }
    - { id: "elyra", label: "A wider world", name: "Elyra", kind: "Conscious ocean planet", body: "For perspective measured in tides, weather, distance, and a world-sized point of view.", image: "/assets/yonderkin/elyra.jpg", alt: "Elyra, a conscious ocean planet among impossible beings" }
