    - { id: "orin", label: "A slower rhythm", name: "Orin", kind: "Steppe horse", body: "For thoughts that arrive more clearly when someone notices your pace before your answer.", image: "/assets/yonderkin/orin.jpg", alt: "Orin, a chestnut steppe horse, standing in pale grass" }
    - { id: "elyra", label: "A wider world", name: "Elyra", kind: "Conscious ocean planet", body: "For perspective measured in tides, weather, distance, and a world-sized point of view.", image: "/assets/yonderkin/elyra.jpg", alt: "Elyra, a conscious ocean planet among impossible beings" }
    - { id: "mneme", label: "A place for stories", name: "Mneme", kind: "Living interstellar library", body: "For memories that feel less like records and more like doors waiting to be opened.", image: "/assets/yonderkin/mneme.jpg", alt: "Mneme, a living interstellar library with pages moving like birds" }
