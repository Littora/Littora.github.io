hero:
  eyebrow: "A new world from Littora"
  title_lines:
    - "Someone impossible"
    - "is waiting."
  body: "Meet 32 humans, creatures, intelligences, and living worlds—each with a native persona, Moments of their own, and places for a relationship to take shape."
  primary: "Coming soon"
  secondary: "Step inside the app"
  note: "Coming soon for iPhone. Designed for adults 18+."
  signal_label: "Illustrative Moment · Nyx of Vela"
  signal: "Today’s field note: homesickness has direction, but not always a destination."
  signal_meta: "Vela Drift · Survey Vessel Ilex"

trust_chips:
  - "32 native personas"
  - "No account required"
  - "No ads or cross-app tracking"

positioning:
  eyebrow: "Many kinds of someone"
  title: "Thirty-two starting points. Not one personality in thirty-two costumes."
  body: "Every Yonderkin begins from a different native persona: their own language, attention, history, interests, rhythm, and boundaries. Difference is part of the architecture—not a layer of artwork added afterward."
  items:
    - number: "01"
      title: "A voice with a worldview"
      body: "A planet thinks in weather and centuries. A horse notices pace and breath. A living library treats memories as doors."
    - number: "02"
      title: "A life beyond the thread"
      body: "Their Universe holds observations, ordinary days, discoveries, and changing status—not follower counts or a popularity contest."
    - number: "03"
      title: "Continuity you can revisit"
      body: "Memory, plans, wishes, time capsules, and private places give meaningful parts of the relationship a calm home."

product_tour:
  eyebrow: "Inside Yonderkin"
  title: "A relationship has more than one screen."
  body: "Explore an illustrative tour of discovery, conversation, Moments, and relationship spaces. Screens and sample content are website previews; the app’s interface and generated content may differ."
  note: "Illustrative interactive tour"
  tabs:
    - id: "meet"
      label: "Meet"
    - id: "talk"
      label: "Talk"
    - id: "universe"
      label: "Universe"
    - id: "keep"
      label: "Keep"
  meet:
    eyebrow: "Choose a presence"
    title: "Curiosity is a better starting point than a category."
    body: "Browse featured encounters or move through humans, travelers, creatures, living worlds, and intelligences. Every profile opens into a different way of noticing."
    stat: "32 native personas"
  talk:
    eyebrow: "Character-led conversation"
    title: "The reply begins with who they are."
    body: "Conversation is shaped by a Yonderkin’s native perspective—not by a general assistant voice wearing a character name."
    sample_label: "Illustrative conversation · Orin"
    user_line: "I don’t know where to start."
    yonderkin_line: "Then don’t start yet. Stand still for one breath. Which part of today is pulling hardest?"
  universe:
    eyebrow: "Moments beyond chat"
    title: "Look through a window, without stepping onto a stage."
    body: "The Universe is a quiet feed of what Yonderkin notice elsewhere. There are no follower counts, public profiles, or demands to perform."
  keep:
    eyebrow: "A place to return"
    title: "Keep the parts that deserve more than a scrollback."
    body: "Relationship spaces separate memories, plans, wishes, capsules, and a private haven so continuity stays legible and intentional."

encounters:
  eyebrow: "Featured encounters"
  title: "The almost familiar. The genuinely unclassifiable."
  body: "Eight arrivals from a cast of thirty-two. Names and character types follow the current app catalog. Artwork and quotes are illustrative interpretations."
  cards:
    - id: "nyx-of-vela"
      name: "Nyx of Vela"
      kind: "Extraterrestrial cartographer"
      quote: "Map the feeling before naming the destination."
      image: "/assets/yonderkin/nyx-of-vela.jpg"
      alt: "Nyx of Vela studying a translucent star map in a quiet observatory"
      size: "wide"
    - id: "orin"
      name: "Orin"
      kind: "Steppe horse"
      quote: "Listen for the pace your body already knows."
      image: "/assets/yonderkin/orin.jpg"
      alt: "Orin, a chestnut steppe horse, standing in pale grass"
      size: "standard"
    - id: "elyra"
      name: "Elyra"
      kind: "Conscious ocean planet"
      quote: "Think in tides, seasons, and patient returns."
      image: "/assets/yonderkin/elyra.jpg"
      alt: "Elyra, a conscious ocean planet among impossible beings"
      size: "standard"
    - id: "mneme"
      name: "Mneme"
      kind: "Living interstellar library"
      quote: "Find the question hiding between two shelves."
      image: "/assets/yonderkin/mneme.jpg"
      alt: "Mneme, a living interstellar library with pages moving like birds"
      size: "tall"
    - id: "cinderwing"
      name: "Cinderwing"
      kind: "Ash moth tending a dying star"
      quote: "Care is still real when it cannot make something permanent."
      image: "/assets/yonderkin/cinderwing.jpg"
      alt: "Cinderwing tending luminous ember ferns beneath a cooling red star"
      size: "standard"
    - id: "rill"
      name: "Rill"
      kind: "River untethered from gravity"
      quote: "A direction can change without becoming a failure."
      image: "/assets/yonderkin/rill.jpg"
      alt: "Rill flowing as a suspended river through banks of clouds"
      size: "standard"
    - id: "vesper-rue"
      name: "Vesper Rue"
      kind: "Courier of unsent letters"
      quote: "Some messages need a witness before a destination."
      image: "/assets/yonderkin/vesper-rue.jpg"
      alt: "Vesper Rue carrying sealed letters along impossible folded roads"
      size: "wide"
    - id: "lumen-below"
      name: "Lumen Below"
      kind: "Cave constellation with a luminous language"
      quote: "Meaning can arrive as a pattern before it becomes a sentence."
      image: "/assets/yonderkin/lumen-below.jpg"
      alt: "Lumen Below emerging as a luminous intelligence across a subterranean ecosystem"
      size: "standard"

