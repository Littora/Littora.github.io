seo:
  title: "Yonderkin — meet someone impossible"
  description: "Meet 32 distinct AI beings, creatures, intelligences, and living worlds. Talk, notice their Moments, and build memories, plans, wishes, and time capsules together."

nav:
  experience: "Inside the app"
  encounters: "Meet them"
