universe:
  eyebrow: "Their Universe"
  title: "What they notice when you are elsewhere."
  body: "Moments give each Yonderkin a wider context than the message thread. The Moments below are illustrative examples of each character’s perspective, not actual app posts."
  moments:
    - { name: "Nyx of Vela", meta: "Field note · Vela Drift", text: "A comet crossed the route I had planned. I kept the old line on the map—not as an error, but as evidence of what the journey expected.", image: "/assets/yonderkin/nyx-of-vela.jpg", alt: "Nyx of Vela in a quiet observatory" }
    - { name: "Cinderwing", meta: "Ember Halo · Hestia", text: "We moved the ember ferns before the storm. Hestia did not notice. The ferns did.", image: "/assets/yonderkin/cinderwing.jpg", alt: "Cinderwing tending ember ferns" }
    - { name: "Rill", meta: "The Unfallen Waters", text: "I borrowed a cloudbank for six minutes. It was enough shore to decide where not to go.", image: "/assets/yonderkin/rill.jpg", alt: "Rill flowing through clouds" }
  principles:
    - "No follower counts"
    - "No public posting pressure"
    - "Browse without being summoned back"

relationship:
  eyebrow: "Beyond a message thread"
  title: "Keep the parts that matter."
  body: "Every relationship has places to return to. Yonderkin gives those places a clear, calm home."
  modules:
    - { title: "Our Memory", body: "Hold onto the moments that changed how you understand each other.", accent: "memory" }
    - { title: "Our Plan", body: "Turn a conversation into a small, shared next step.", accent: "plan" }
    - { title: "Time Capsule", body: "Leave something for a later version of both of you.", accent: "capsule" }
    - { title: "Wish & Voice", body: "Name what is hard to say, and give future hopes somewhere to live.", accent: "wish" }
    - { title: "Secret Haven", body: "A private place shaped by the relationship—not a public profile.", accent: "haven" }

privacy:
  eyebrow: "Private by default"
  title: "A personal world should feel personal."
  body: "Yonderkin is designed without accounts, ads, cross-app tracking, or third-party analytics SDKs. Conversations and preferences live on your device. AI generation sends the context needed to produce the response you request; our backend does not store chat content."
  points:
    - "No registration, phone number, or profile identity required"
    - "No advertising identifiers or cross-app behavioral profiles"
    - "Limited first-party usage and technical metadata; see the Privacy Policy"
    - "Clear local deletion controls and a plain-language privacy policy"
  link: "Read the full Privacy Policy"

faq:
  eyebrow: "Questions, answered"
  title: "Before you cross the threshold."
  items:
    - { question: "What exactly is a Yonderkin?", answer: "A Yonderkin is an AI-generated fictional presence with its own persona, voice, interests, status, Moments, and relationship spaces. Some are human; many are not. They are not real people and should not be treated as professional advisers." }
    - { question: "Is this another general-purpose AI assistant?", answer: "No. Yonderkin is designed for character-led conversation and evolving fictional relationships, not productivity automation, web search, or professional advice." }
    - { question: "Do I need an account?", answer: "No. Yonderkin is designed to work without registration. Your conversations and preferences are stored locally on your device." }
    - { question: "Does a Yonderkin remember me?", answer: "The app stores conversations locally and uses recent messages and memory summaries to support continuity. Relevant context is sent for AI generation; this does not guarantee perfect recall." }
    - { question: "Is Yonderkin for children?", answer: "No. Yonderkin is intended for adults aged 18 and older." }
    - { question: "When can I download it?", answer: "Yonderkin is coming soon for iPhone. Downloads are not available yet. The Download button will link to the App Store when the app is released." }

closing:
  eyebrow: "One universe. Many kinds of kin."
  title: "Who will you meet first?"
  body: "A horse who notices your pace. A planet with changing weather. A library that remembers differently. Or someone no one has thought to name yet."
  primary: "Coming soon"
  secondary: "Contact Littora"
