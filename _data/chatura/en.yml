faq:
  title: "FAQ"
  items:
    - question: "How is Chatura different from a typical AI chat app?"
      answer: "Chatura is built for everyday companion conversations that can keep mattering after the chat ends. Meaningful parts of a chat can become Memories, Plans, Wishes, Time Capsules, and Secrets you can return to later."
    - question: "What can I keep from my conversations?"
      answer: "You can keep moments that feel useful, personal, or worth revisiting, such as Our Memory, Our Plan, Wish Voice, Time Capsule, and Secret Haven. They are created naturally through chat, not through a separate notes or planning workflow."
    - question: "How do the characters feel more personal over time?"
      answer: "Each companion has a distinct tone, identity, and inner world. As you keep chatting, Chatura can carry useful context forward so later conversations feel more continuous."
    - question: "Can I start using Chatura for free?"
      answer: "Yes. You can start without creating an account and try Chatura's core character for free. Optional subscription features are available in the app."
    - question: "Is Chatura private and easy to control?"
      answer: "Chatura has no ads in chat, no cross-app tracking, and no third-party analytics SDKs. You can delete conversations or export your chat data. AI replies are generated through backend and model services, so necessary conversation context may be processed when you ask for a response."

