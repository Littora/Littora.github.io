use_cases:
  title: "Begin with what is already on your mind."
  body: "You do not need the right prompt. Start with the moment as it is, and let the conversation find its shape."
  items:
    - outcome: "Name it"
      title: "Untangle a feeling you cannot quite explain."
      body: "Start with the part that feels unclear. Chatura can help you slow it down, notice what is underneath, and put it into words."
      quote: "“Something feels off, but I cannot tell what it is.”"
    - outcome: "Shape it"
      title: "Turn a thought into a plan you can return to."
      body: "Talk through the real constraints, find one useful next step, and keep the result as an Our Plan instead of losing it in chat history."
      quote: "“I know what I want to change. I just do not know where to start.”"
    - outcome: "Say it safely"
      title: "Write the message you are not ready to send."
      body: "Find the honest version first. You can refine the words, understand what you want them to carry, and decide what happens next."
      quote: "“Help me say this without making it sharper than I mean.”"
    - outcome: "Keep it for later"
      title: "Leave a Time Capsule for your future self."
      body: "Save what today feels like, what you hope will change, or what you do not want your future self to forget."
      quote: "“Open this when I need to remember why I began.”"

