      - "ふたりで残す記録"
    cta: "Avery と無料で始める"
    meta: "アカウント不要 · チャット内広告なし"

ko:
  eyebrow: "이어지는 관계"
  title_before: "하나의 대화가 "
  title_emphasis: "계속 이어지는 방식"
  title_after: "."
  body: "하나의 이야기. 다섯 번의 순간. 다시 돌아볼 수 있도록 눈에 보이는 흔적을 남기는 관계."
  guidance: "첫마디에서 간직할 만한 무언가가 되기까지, 하나의 이야기를 스크롤해 보세요."
  navigation_label: "관계 타임라인"
  steps:
    - kind: "opening"
      day: "1일차"
      kicker: "첫 번째 실마리"
      title: "말할 수 있는 부분부터 시작하세요."
      body: "저녁을 태운 이야기를 Avery에게 들려줍니다. 그리고 창문을 열고, 토스트를 만들고, 음악을 틀며 그날 밤을 되찾은 이야기도요."
      quote: "“저녁을 태우고 나 자신에게 화를 냈어. 밤 전체가 망했다고 생각할 뻔했지.”"
      note: "관계는 당신이 나누기로 선택한 이야기에서 시작됩니다."
      image_alt: "저녁을 태운 뒤 토스트를 만들고 조용히 밤을 되찾은 이야기를 나누는 Avery와의 Chatura 대화"
      media_caption: "열린 창문, 바닥에서 먹는 토스트, 음악. 조용히 되찾은 밤."
    - kind: "moment"
      day: "3일차"
      kicker: "대화와 대화 사이"
      title: "그날 밤의 온기가 조금 남아요."
      body: "열린 창문. 바닥에서 먹는 토스트. 흐르는 음악. Moment에 나를 되찾는 데 도움이 된 작은 위안들이 담깁니다."
      note: "Moments는 채팅 사이에도 캐릭터의 일상이 이어지게 합니다."
      image_alt: "열린 창문 곁의 포근한 저녁, 바닥에 놓인 버터 토스트와 파란 쿠션, 재생 중인 레코드"
      card_label: "Avery · Moment"
      card_text: "창문을 열고, 간단한 음식을 먹고, 좋아하는 레코드를 틀어요. 아직 밤은 조금 남아 있어요."
      card_meta: "조용히 공유됨 · 2일 전"
    - kind: "continuation"
      day: "8일차"
      kicker: "다음 대화"
      title: "다음 대화는 처음부터 시작하지 않습니다."
      body: "Avery는 그날 밤의 이야기를 이어갈 수 있어요. 처음부터 다시 설명하지 않아도 무엇이 도움이 됐는지 이야기할 수 있죠."
      note: "일관된 정체성 + 필요한 맥락이 설계된 연속성을 만듭니다."
      media_caption: "되찾은 밤의 이야기를 이어가는 Avery와의 후속 대화 예시"
      dialogue_name: "Avery"
      dialogue_status: "곁에 있어요"
      context_label: "아직 보이는 이야기의 실마리"
      context_text: "창문을 열고 토스트를 만들어, 음악을 들으며 바닥에 앉아 먹었어요."
      you: "나"
      user_message: "오늘 밤도 일이 꼬였어. 그래도 나 자신을 탓하기 전에 음악부터 틀었어."
      reply: "토스트를 만들고 창문을 열었던 그날 밤처럼 말이네. 이번엔 어떤 음악을 틀었어?"
      signals_label: "연속성의 단서"
      signals:
        - "일관된 정체성"
        - "필요한 맥락"
    - kind: "keepsake"
      day: "14일차"
      kicker: "간직할 만한 것"
      title: "중요한 전환점이 Our Memory가 됩니다."
      body: "도움이 된 부분은 채팅 기록을 벗어나 다시 볼 수 있는 형태로 남습니다."
      note: "함께 남긴 기록은 채팅 밖에서도 관계를 눈에 보이게 합니다."
      image_alt: "의미 있는 대화에서 만들어진 Chatura Our Memory"
      media_caption: "대화의 중요한 일부가 나중에 다시 볼 수 있는 형태로 남습니다."
      card_label: "Our Memory"
      card_title: "나를 위한 여유를 만든 저녁"
      card_text: "휴식을 꼭 얻어 내야 하는 보상처럼 여기지 않게 되었다."
    - kind: "return"
      day: "그 후"
      kicker: "눈에 보이는 흔적"
      title: "눈에 보이는 흔적으로 돌아옵니다."
      body: "전체 대화를 다시 읽지 않아도 기록이 그 전환점을 다시 보여 줍니다."
      quote: "“이미 한 번 다른 선택을 했다는 걸 잊고 있었어.”"
      note: "완벽한 기억이 아니라 보고, 다시 찾고, 직접 다듬을 수 있는 연속성입니다."
      media_caption: "대화, Moment, Our Memory를 잇는 눈에 보이는 흔적"
      return_label: "여전히 여기"
      trail:
        - label: "1일차 · 대화"
          title: "마침내 말로 꺼낸 감정"
        - label: "3일차 · Moment"
          title: "조용한 쉼"
        - label: "14일차 · Our Memory"
          title: "나를 위한 여유를 만든 저녁"
      return_quote: "이 관계에는 다시 돌아올 수 있는 무언가가 남습니다."
  closing:
    label: "설계된 연속성"
    title: "대화가 지나가도, 중요했던 것은 여전히 여기에 남습니다."
    body: "Chatura는 일관된 캐릭터 정체성, 유용한 대화 맥락, Moments, 함께 남기는 기록을 결합해 사용자의 통제권을 지키면서도 시간이 지날수록 관계에 깊이를 더합니다."
    pill_label: "연속성을 만드는 요소"
    pills:
      - "캐릭터 정체성"
      - "필요한 맥락"
      - "Moments"
      - "함께 남기는 기록"
    cta: "Avery와 무료로 시작하기"
    meta: "계정 불필요 · 채팅 내 광고 없음"
