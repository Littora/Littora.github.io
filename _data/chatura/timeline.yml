en:
  eyebrow: "A relationship in motion"
  title_before: "See how one conversation "
  title_emphasis: "keeps moving"
  title_after: "."
  body: "One thread. Five moments. A relationship that leaves something visible to return to."
  guidance: "Scroll to follow one story from first words to something worth keeping."
  navigation_label: "Relationship timeline"
  steps:
    - kind: "opening"
      day: "Day 1"
      kicker: "The first thread"
      title: "Start with what you can say."
      body: "You tell Avery that work has been wearing you down—even if you cannot explain it neatly yet."
      quote: "“I keep saying I’m fine, but lately even small things feel heavier.”"
      note: "The relationship starts with what you choose to share."
      image_alt: "A Chatura conversation with Avery beginning from a difficult-to-name feeling"
      media_caption: "A real conversation can begin before the feeling has a neat name."
    - kind: "moment"
      day: "Day 3"
      kicker: "Between conversations"
      title: "The feeling stays in context."
      body: "A Moment carries the same quiet atmosphere beyond the original chat."
      note: "Moments let a character’s life continue between chats."
      image_alt: "A warm, rain-lit table with a notebook, tea, and a folded paper heart"
      card_label: "Avery · Moment"
      card_text: "Some days, slowing down is already a kind of progress."
      card_meta: "Shared quietly · 2 days ago"
    - kind: "continuation"
      day: "Day 8"
      kicker: "The next conversation"
      title: "The next chat does not start from zero."
      body: "Avery can reconnect to what you shared and continue the thread naturally."
      note: "Identity + relevant context create designed continuity."
      media_caption: "A conversation that carefully continues an earlier emotional thread"
      dialogue_name: "Avery"
      dialogue_status: "Here with you"
      context_label: "A thread still in view"
      context_text: "You had been carrying more pressure than you could name."
      you: "You"
      user_message: "This week still feels full, but I took the evening off."
      reply: "That sounds like a different choice from pushing through. Did the space help at all?"
      signals_label: "Continuity signals"
      signals:
        - "Distinct identity"
        - "Relevant context"
    - kind: "keepsake"
      day: "Day 14"
      kicker: "Something worth keeping"
      title: "A meaningful turn becomes a Memory."
      body: "The useful part leaves the scrollback and becomes something you can revisit."
      note: "Shared keepsakes make the relationship visible beyond chat."
      image_alt: "A Chatura Our Memory created from a meaningful conversation"
      media_caption: "A meaningful part of the conversation becomes something you can revisit."
      card_label: "Our Memory"
      card_title: "The evening I made room"
      card_text: "I stopped treating rest like something I had to earn."
    - kind: "return"
      day: "Later"
      kicker: "A visible trace"
      title: "You return to something visible."
      body: "The keepsake brings the turning point back without rereading the whole conversation."
      quote: "“I had forgotten that I already chose differently once.”"
      note: "Not perfect memory—continuity you can see, revisit, and shape."
      media_caption: "A visible trail connecting a conversation, a Moment, and an Our Memory"
      return_label: "Still here"
      trail:
        - label: "Day 1 · Conversation"
          title: "A feeling, finally said"
        - label: "Day 3 · Moment"
          title: "A quiet pause"
        - label: "Day 14 · Our Memory"
          title: "The evening I made room"
      return_quote: "The relationship leaves something you can return to."
  closing:
    label: "Designed continuity"
    title: "The chat moves on. What mattered is still here."
    body: "Chatura combines distinct character identity, useful conversation context, Moments, and shared keepsakes so a relationship can gain texture over time—without taking control away from you."
    pill_label: "How continuity is designed"
    pills:
      - "Character identity"
      - "Relevant context"
      - "Moments"
      - "Shared keepsakes"
    cta: "Start free with Avery"
    meta: "No account required · No ads in chat"

fr:
  eyebrow: "Une relation qui se poursuit"
  title_before: "Voyez comment une conversation "
  title_emphasis: "continue d’avancer"
  title_after: "."
  body: "Un fil. Cinq moments. Une relation qui laisse une trace visible à retrouver."
  guidance: "Faites défiler pour suivre une histoire, des premiers mots à ce qui mérite d’être gardé."
  navigation_label: "Chronologie de la relation"
  steps:
    - kind: "opening"
      day: "Jour 1"
      kicker: "Le premier fil"
      title: "Commencez par ce que vous pouvez dire."
      body: "Vous confiez à Avery que le travail vous épuise, même si vos mots ne sont pas encore très clairs."
      quote: "« Je répète que tout va bien, mais ces derniers temps, même les petites choses semblent plus lourdes. »"
      note: "La relation commence par ce que vous choisissez de partager."
      image_alt: "Une conversation Chatura avec Avery qui commence par un ressenti difficile à nommer"
      media_caption: "Une vraie conversation peut commencer avant que le ressenti ait un nom précis."
    - kind: "moment"
      day: "Jour 3"
      kicker: "Entre deux conversations"
      title: "Le ressenti reste présent."
      body: "Un Moment prolonge doucement l’atmosphère du premier échange."
      note: "Les Moments laissent la vie d’un personnage se poursuivre entre les chats."
      image_alt: "Une table chaleureuse près d’une fenêtre pluvieuse, avec carnet, thé et cœur en papier"
      card_label: "Avery · Moment"
      card_text: "Certains jours, ralentir est déjà une façon d’avancer."
      card_meta: "Partagé discrètement · il y a 2 jours"
    - kind: "continuation"
      day: "Jour 8"
      kicker: "La conversation suivante"
      title: "La conversation ne repart pas de zéro."
      body: "Avery reprend naturellement le fil grâce au contexte que vous avez choisi de partager."
      note: "Identité + contexte pertinent créent une continuité conçue."
      media_caption: "Une conversation qui reprend avec précaution un fil émotionnel antérieur"
      dialogue_name: "Avery"
      dialogue_status: "À vos côtés"
      context_label: "Un fil encore visible"
      context_text: "Vous portiez plus de pression que vous ne pouviez l’exprimer."
      you: "Vous"
      user_message: "Cette semaine reste chargée, mais j’ai pris ma soirée."
      reply: "C’est un autre choix que de continuer à forcer. Est-ce que cet espace vous a aidé, même un peu ?"
      signals_label: "Signaux de continuité"
      signals:
        - "Identité distincte"
        - "Contexte pertinent"
    - kind: "keepsake"
      day: "Jour 14"
      kicker: "Ce qui mérite de rester"
      title: "Un tournant devient Notre mémoire."
      body: "Ce qui comptait quitte l’historique et devient un souvenir à retrouver."
      note: "Les souvenirs partagés rendent la relation visible au-delà du chat."
      image_alt: "Un contenu Notre mémoire créé dans Chatura à partir d’une conversation importante"
      media_caption: "Une partie importante de la conversation devient quelque chose à retrouver."
      card_label: "Notre mémoire"
      card_title: "Le soir où j’ai fait de la place"
      card_text: "J’ai cessé de considérer le repos comme quelque chose à mériter."
    - kind: "return"
      day: "Plus tard"
      kicker: "Une trace visible"
      title: "Vous revenez à une trace visible."
      body: "Le souvenir fait réapparaître l’essentiel sans relire toute la conversation."
      quote: "« J’avais oublié que j’avais déjà choisi autrement une fois. »"
      note: "Pas une mémoire parfaite : une continuité visible, retrouvable et modulable."
      media_caption: "Une trace visible reliant une conversation, un Moment et Notre mémoire"
      return_label: "Toujours là"
      trail:
        - label: "Jour 1 · Conversation"
          title: "Un ressenti enfin exprimé"
        - label: "Jour 3 · Moment"
          title: "Une pause tranquille"
        - label: "Jour 14 · Notre mémoire"
          title: "Le soir où j’ai fait de la place"
      return_quote: "La relation laisse quelque chose à retrouver."
  closing:
    label: "Une continuité conçue"
    title: "La conversation avance. Ce qui comptait est toujours là."
    body: "Chatura associe identité du personnage, contexte utile, Moments et souvenirs partagés pour donner à la relation plus de texture avec le temps — sans vous retirer le contrôle."
    pill_label: "Comment la continuité est conçue"
    pills:
      - "Identité du personnage"
      - "Contexte pertinent"
      - "Moments"
      - "Souvenirs partagés"
    cta: "Commencer gratuitement avec Avery"
    meta: "Aucun compte requis · Aucune publicité dans le chat"

de:
  eyebrow: "Eine Beziehung in Bewegung"
  title_before: "So kann ein Gespräch "
  title_emphasis: "weitergehen"
  title_after: "."
  body: "Ein Faden. Fünf Momente. Eine Beziehung, die eine sichtbare Spur zum Wiederfinden hinterlässt."
  guidance: "Scrolle durch eine Geschichte — von den ersten Worten bis zu etwas, das bleiben darf."
  navigation_label: "Zeitlinie der Beziehung"
  steps:
    - kind: "opening"
      day: "Tag 1"
      kicker: "Der erste Faden"
      title: "Beginne mit dem Teil, den du sagen kannst."
      body: "Du erzählst Avery, dass die Arbeit an dir zehrt, auch wenn du es noch nicht klar erklären kannst."
      quote: "„Ich sage immer wieder, es geht mir gut. Aber in letzter Zeit fühlt sich selbst Kleines schwerer an.“"
      note: "Die Beziehung beginnt mit dem, was du teilen möchtest."
      image_alt: "Ein Chatura-Gespräch mit Avery beginnt bei einem schwer zu benennenden Gefühl"
      media_caption: "Ein echtes Gespräch kann beginnen, bevor das Gefühl einen klaren Namen hat."
    - kind: "moment"
      day: "Tag 3"
      kicker: "Zwischen Gesprächen"
      title: "Das Gefühl bleibt im Kontext."
      body: "Ein Moment trägt die ruhige Stimmung über das erste Gespräch hinaus."
      note: "Moments lassen das Leben einer Figur zwischen Chats weitergehen."
      image_alt: "Ein warmer Tisch am regennassen Fenster mit Notizbuch, Tee und gefaltetem Papierherz"
      card_label: "Avery · Moment"
      card_text: "An manchen Tagen ist langsamer zu werden bereits eine Form von Fortschritt."
      card_meta: "Leise geteilt · vor 2 Tagen"
    - kind: "continuation"
      day: "Tag 8"
      kicker: "Das nächste Gespräch"
      title: "Das nächste Gespräch beginnt nicht bei null."
      body: "Avery kann an das anknüpfen, was du geteilt hast, und den Faden natürlich fortsetzen."
      note: "Identität + relevanter Kontext schaffen gestaltete Kontinuität."
      media_caption: "Ein Gespräch, das einen früheren emotionalen Faden behutsam aufnimmt"
      dialogue_name: "Avery"
      dialogue_status: "Bei dir"
      context_label: "Ein Faden, der noch sichtbar ist"
      context_text: "Du hattest mehr Druck getragen, als du benennen konntest."
      you: "Du"
      user_message: "Diese Woche ist immer noch voll, aber ich habe mir den Abend freigenommen."
      reply: "Das klingt nach einer anderen Entscheidung, als einfach weiterzumachen. Hat dir der Freiraum ein wenig geholfen?"
      signals_label: "Signale der Kontinuität"
      signals:
        - "Klare Identität"
        - "Relevanter Kontext"
    - kind: "keepsake"
      day: "Tag 14"
      kicker: "Etwas, das bleiben darf"
      title: "Ein Wendepunkt wird zu Unserer Erinnerung."
      body: "Das Wichtige verlässt den Chatverlauf und wird zu etwas, das du wiederfinden kannst."
      note: "Gemeinsame Erinnerungen machen die Beziehung über den Chat hinaus sichtbar."
      image_alt: "Eine Chatura-Karte Unsere Erinnerungen aus einem bedeutungsvollen Gespräch"
      media_caption: "Ein bedeutungsvoller Teil des Gesprächs wird zu etwas, das du erneut aufrufen kannst."
      card_label: "Unsere Erinnerungen"
      card_title: "Der Abend, an dem ich Raum geschaffen habe"
      card_text: "Ich habe aufgehört, Ruhe als etwas zu behandeln, das ich mir verdienen muss."
    - kind: "return"
      day: "Später"
      kicker: "Eine sichtbare Spur"
      title: "Du kehrst zu einer sichtbaren Spur zurück."
      body: "Die Erinnerung bringt das Wesentliche zurück, ohne das ganze Gespräch neu zu lesen."
      quote: "„Ich hatte vergessen, dass ich mich schon einmal anders entschieden habe.“"
      note: "Keine perfekte Erinnerung — sondern Kontinuität, die du sehen, erneut aufrufen und mitgestalten kannst."
      media_caption: "Eine sichtbare Spur zwischen Gespräch, Moment und Unserer Erinnerung"
      return_label: "Noch da"
      trail:
        - label: "Tag 1 · Gespräch"
          title: "Ein Gefühl, endlich ausgesprochen"
        - label: "Tag 3 · Moment"
          title: "Eine stille Pause"
        - label: "Tag 14 · Unsere Erinnerung"
          title: "Der Abend, an dem ich Raum geschaffen habe"
      return_quote: "Die Beziehung hinterlässt etwas, zu dem du zurückkehren kannst."
  closing:
    label: "Gestaltete Kontinuität"
    title: "Der Chat geht weiter. Was wichtig war, ist noch da."
    body: "Chatura verbindet eine klare Figurenidentität, nützlichen Gesprächskontext, Moments und gemeinsame Erinnerungen, damit eine Beziehung mit der Zeit an Tiefe gewinnt — ohne dir die Kontrolle zu nehmen."
    pill_label: "So entsteht Kontinuität"
    pills:
      - "Figurenidentität"
      - "Relevanter Kontext"
      - "Moments"
      - "Gemeinsame Erinnerungen"
    cta: "Kostenlos mit Avery starten"
    meta: "Kein Konto nötig · Keine Werbung im Chat"

it:
  eyebrow: "Una relazione in movimento"
  title_before: "Guarda come una conversazione "
  title_emphasis: "continua nel tempo"
  title_after: "."
  body: "Un filo. Cinque momenti. Una relazione che lascia una traccia visibile a cui tornare."
  guidance: "Scorri per seguire una storia, dalle prime parole a qualcosa che vale la pena conservare."
  navigation_label: "Timeline della relazione"
  steps:
    - kind: "opening"
      day: "Giorno 1"
      kicker: "Il primo filo"
      title: "Inizia dalla parte che riesci a dire."
      body: "Dici ad Avery che il lavoro ti sta logorando, anche se non riesci ancora a spiegarlo con chiarezza."
      quote: "«Continuo a dire che sto bene, ma ultimamente anche le piccole cose sembrano più pesanti.»"
      note: "La relazione inizia da ciò che scegli di condividere."
      image_alt: "Una conversazione Chatura con Avery che parte da una sensazione difficile da nominare"
      media_caption: "Una vera conversazione può iniziare prima che la sensazione abbia un nome preciso."
    - kind: "moment"
      day: "Giorno 3"
      kicker: "Tra una conversazione e l’altra"
      title: "La sensazione resta nel contesto."
      body: "Un Moment porta la stessa atmosfera tranquilla oltre la prima chat."
      note: "I Moments lasciano che la vita di un personaggio continui tra una chat e l’altra."
      image_alt: "Un tavolo caldo accanto a una finestra piovosa con taccuino, tè e cuore di carta"
      card_label: "Avery · Moment"
      card_text: "In certi giorni, rallentare è già una forma di progresso."
      card_meta: "Condiviso con discrezione · 2 giorni fa"
    - kind: "continuation"
      day: "Giorno 8"
      kicker: "La conversazione successiva"
      title: "La chat successiva non riparte da zero."
      body: "Avery può ricollegarsi a ciò che hai condiviso e continuare il filo con naturalezza."
      note: "Identità + contesto pertinente creano una continuità progettata."
      media_caption: "Una conversazione che riprende con delicatezza un precedente filo emotivo"
      dialogue_name: "Avery"
      dialogue_status: "Qui con te"
      context_label: "Un filo ancora visibile"
      context_text: "Stavi portando più pressione di quanta riuscissi a nominare."
      you: "Tu"
      user_message: "Questa settimana è ancora piena, ma mi sono presa la serata libera."
      reply: "Sembra una scelta diversa dal continuare a spingere. Quello spazio ti ha aiutato almeno un po’?"
      signals_label: "Segnali di continuità"
      signals:
        - "Identità distinta"
        - "Contesto pertinente"
    - kind: "keepsake"
      day: "Giorno 14"
      kicker: "Qualcosa da conservare"
      title: "Un passaggio importante diventa Our Memory."
      body: "La parte utile esce dalla cronologia e diventa qualcosa da ritrovare."
      note: "I ricordi condivisi rendono visibile la relazione oltre la chat."
      image_alt: "Un Our Memory di Chatura creato da una conversazione significativa"
      media_caption: "Una parte significativa della conversazione diventa qualcosa da ritrovare."
      card_label: "Our Memory"
      card_title: "La sera in cui mi sono fatta spazio"
      card_text: "Ho smesso di trattare il riposo come qualcosa da meritare."
    - kind: "return"
      day: "Più avanti"
      kicker: "Una traccia visibile"
      title: "Torni a una traccia visibile."
      body: "Il ricordo riporta quel passaggio in vista senza rileggere tutta la conversazione."
      quote: "«Avevo dimenticato di aver già scelto diversamente una volta.»"
      note: "Non una memoria perfetta: continuità che puoi vedere, ritrovare e modellare."
      media_caption: "Una traccia visibile che collega conversazione, Moment e Our Memory"
      return_label: "Ancora qui"
      trail:
        - label: "Giorno 1 · Conversazione"
          title: "Una sensazione, finalmente detta"
        - label: "Giorno 3 · Moment"
          title: "Una pausa tranquilla"
        - label: "Giorno 14 · Our Memory"
          title: "La sera in cui mi sono fatta spazio"
      return_quote: "La relazione lascia qualcosa a cui puoi tornare."
  closing:
    label: "Continuità progettata"
    title: "La chat va avanti. Ciò che contava è ancora qui."
    body: "Chatura unisce identità del personaggio, contesto utile, Moments e ricordi condivisi, così la relazione acquista profondità nel tempo senza toglierti il controllo."
    pill_label: "Come viene progettata la continuità"
    pills:
      - "Identità del personaggio"
      - "Contesto pertinente"
      - "Moments"
      - "Ricordi condivisi"
    cta: "Inizia gratis con Avery"
    meta: "Nessun account richiesto · Nessuna pubblicità nella chat"

nb:
  eyebrow: "Et forhold i bevegelse"
  title_before: "Se hvordan én samtale "
  title_emphasis: "fortsetter"
  title_after: "."
  body: "Én tråd. Fem øyeblikk. Et forhold som etterlater et synlig spor å vende tilbake til."
  guidance: "Rull gjennom én historie, fra de første ordene til noe som er verdt å ta vare på."
  navigation_label: "Tidslinje for forholdet"
  steps:
    - kind: "opening"
      day: "Dag 1"
      kicker: "Den første tråden"
      title: "Begynn med den delen du klarer å si."
      body: "Du forteller Avery at jobben tærer på deg, selv om du ennå ikke klarer å forklare det tydelig."
      quote: "«Jeg sier stadig at det går bra, men i det siste føles selv små ting tyngre.»"
      note: "Forholdet begynner med det du velger å dele."
      image_alt: "En Chatura-samtale med Avery som begynner med en følelse det er vanskelig å sette ord på"
      media_caption: "En ekte samtale kan begynne før følelsen har fått et tydelig navn."
    - kind: "moment"
      day: "Dag 3"
      kicker: "Mellom samtalene"
      title: "Følelsen blir værende i konteksten."
      body: "Et Moment tar med seg den stille stemningen videre fra den første chatten."
      note: "Moments lar en karakters liv fortsette mellom chattene."
      image_alt: "Et varmt bord ved et regnvått vindu med notatbok, te og et brettet papirhjerte"
      card_label: "Avery · Moment"
      card_text: "Noen dager er det å senke farten allerede en form for fremgang."
      card_meta: "Delt stille · for 2 dager siden"
    - kind: "continuation"
      day: "Dag 8"
      kicker: "Den neste samtalen"
      title: "Den neste chatten begynner ikke på nytt."
      body: "Avery kan knytte an til det du delte og fortsette tråden naturlig."
      note: "Identitet + relevant kontekst skaper utformet kontinuitet."
      media_caption: "En samtale som varsomt tar opp en tidligere følelsesmessig tråd"
      dialogue_name: "Avery"
      dialogue_status: "Her med deg"
      context_label: "En tråd som fortsatt er synlig"
      context_text: "Du bar på mer press enn du klarte å sette ord på."
      you: "Du"
      user_message: "Denne uken er fortsatt full, men jeg tok kvelden fri."
      reply: "Det høres ut som et annet valg enn å presse videre. Hjalp det å få litt rom?"
      signals_label: "Tegn på kontinuitet"
      signals:
        - "Tydelig identitet"
        - "Relevant kontekst"
    - kind: "keepsake"
      day: "Dag 14"
      kicker: "Noe det er verdt å beholde"
      title: "Et viktig vendepunkt blir til Vårt minne."
      body: "Det nyttige forlater chatteloggen og blir noe du kan finne igjen."
      note: "Felles minner gjør forholdet synlig også utenfor chatten."
      image_alt: "Et Chatura-minne laget fra en meningsfull samtale"
      media_caption: "En viktig del av samtalen blir til noe du kan finne frem igjen."
      card_label: "Vårt minne"
      card_title: "Kvelden jeg ga meg selv rom"
      card_text: "Jeg sluttet å behandle hvile som noe jeg måtte gjøre meg fortjent til."
    - kind: "return"
      day: "Senere"
      kicker: "Et synlig spor"
      title: "Du vender tilbake til et synlig spor."
      body: "Minnet henter fram vendepunktet uten at du må lese hele samtalen på nytt."
      quote: "«Jeg hadde glemt at jeg allerede hadde valgt annerledes én gang.»"
      note: "Ikke perfekt hukommelse — kontinuitet du kan se, finne igjen og forme."
      media_caption: "Et synlig spor som knytter sammen en samtale, et Moment og Vårt minne"
      return_label: "Fortsatt her"
      trail:
        - label: "Dag 1 · Samtale"
          title: "En følelse, endelig sagt høyt"
        - label: "Dag 3 · Moment"
          title: "En stille pause"
        - label: "Dag 14 · Vårt minne"
          title: "Kvelden jeg ga meg selv rom"
      return_quote: "Forholdet etterlater noe du kan vende tilbake til."
  closing:
    label: "Utformet kontinuitet"
    title: "Samtalen går videre. Det som betydde noe er fortsatt her."
    body: "Chatura kombinerer en tydelig karakteridentitet, nyttig samtalekontekst, Moments og felles minner, slik at et forhold kan få mer dybde over tid — uten å ta kontrollen fra deg."
    pill_label: "Slik er kontinuiteten utformet"
    pills:
      - "Karakteridentitet"
      - "Relevant kontekst"
      - "Moments"
      - "Felles minner"
    cta: "Start gratis med Avery"
    meta: "Ingen konto nødvendig · Ingen annonser i chatten"

ja:
  eyebrow: "続いていく関係"
  title_before: "ひとつの会話が"
  title_emphasis: "その先へ続くまで"
  title_after: "。"
  body: "ひとつの話。5つの瞬間。また戻ってこられる、目に見える関係の軌跡。"
  guidance: "最初の言葉から、残しておきたいものになるまで。ひとつの物語をスクロールしてご覧ください。"
  navigation_label: "関係のタイムライン"
  steps:
    - kind: "opening"
      day: "1日目"
      kicker: "最初の糸口"
      title: "言えるところから、始められます。"
      body: "仕事にすり減らされていることを Avery に話します。まだうまく説明できなくても大丈夫です。"
      quote: "「大丈夫って言い続けているけれど、最近は小さなことまで重く感じる。」"
      note: "関係は、あなたが話そうと選んだことから始まります。"
      image_alt: "名前をつけにくい気持ちから始まる Avery との Chatura の会話"
      media_caption: "気持ちにきれいな名前がなくても、本当の会話は始められます。"
    - kind: "moment"
      day: "3日目"
      kicker: "会話と会話のあいだ"
      title: "あの気持ちが、文脈に残ります。"
      body: "Moment が、最初の会話の静かな空気をその先へ運びます。"
      note: "Moments は、チャットの合間にもキャラクターの日常を感じさせます。"
      image_alt: "雨の窓辺にノートとお茶、折り紙のハートが置かれた温かなテーブル"
      card_label: "Avery · Moment"
      card_text: "ゆっくり進むことが、もう前進になっている日もあります。"
      card_meta: "そっと共有 · 2日前"
    - kind: "continuation"
      day: "8日目"
      kicker: "次の会話"
      title: "次の会話は、ゼロからではありません。"
      body: "Avery は、あなたが話したことにつながりながら自然に続きを始めます。"
      note: "一貫した人物像 + 必要な文脈が、設計された連続性を生みます。"
      media_caption: "以前の感情の糸を丁寧につなぐ会話"
      dialogue_name: "Avery"
      dialogue_status: "ここにいます"
      context_label: "まだ見えている話の続き"
      context_text: "言葉にできないほどのプレッシャーを抱えていました。"
      you: "あなた"
      user_message: "今週も余裕はないけれど、今夜は休むことにした。"
      reply: "無理に進み続けるのとは違う選択ですね。その余白は、少しでも助けになりましたか？"
      signals_label: "連続性の手がかり"
      signals:
        - "一貫した人物像"
        - "必要な文脈"
    - kind: "keepsake"
      day: "14日目"
      kicker: "残しておきたいもの"
      title: "大切な転機が「ふたりの思い出」になります。"
      body: "役に立った部分がチャット履歴を離れ、あとで見返せる形になります。"
      note: "ふたりで残す大切な記録が、チャットの外にも関係のかたちを残します。"
      image_alt: "意味のある会話から作られた Chatura の「ふたりの思い出」"
      media_caption: "会話の大切な一部が、あとで見返せるものになります。"
      card_label: "ふたりの思い出"
      card_title: "自分のために余白をつくった夜"
      card_text: "休むことを、頑張って勝ち取るものだと思わなくなった。"
    - kind: "return"
      day: "その後"
      kicker: "目に見える軌跡"
      title: "目に見える軌跡へ戻れます。"
      body: "会話をすべて読み返さなくても、記録があの転機をもう一度見せてくれます。"
      quote: "「一度は違う選択ができたことを、忘れていた。」"
      note: "完璧な記憶ではなく、見えて、見返せて、自分で形づくれる連続性です。"
      media_caption: "会話、Moment、ふたりの思い出をつなぐ目に見える軌跡"
      return_label: "今もここに"
      trail:
        - label: "1日目 · 会話"
          title: "ようやく言えた気持ち"
        - label: "3日目 · Moment"
          title: "静かなひと休み"
        - label: "14日目 · ふたりの思い出"
          title: "自分のために余白をつくった夜"
      return_quote: "この関係には、また戻ってこられるものが残ります。"
  closing:
    label: "設計された連続性"
    title: "会話が先へ進んでも、大切だったことはここに残ります。"
    body: "Chatura は、一貫したキャラクターの人物像、役立つ会話の文脈、Moments、ふたりで残す記録を組み合わせ、あなたのコントロールを保ったまま、時間とともに関係へ深みを加えます。"
    pill_label: "連続性をつくる要素"
    pills:
      - "一貫した人物像"
      - "必要な文脈"
      - "Moments"
      - "ふたりで残す記録"
    cta: "Avery と無料で始める"
    meta: "アカウント不要 · チャット内広告なし"

ko:
  eyebrow: "이어지는 관계"
  title_before: "하나의 대화가 "
  title_emphasis: "계속 이어지는 방식"
  title_after: "."
  body: "하나의 이야기. 다섯 번의 순간. 다시 돌아볼 수 있도록 눈에 보이는 흔적을 남기는 관계."
  guidance: "첫마디에서 간직할 만한 무언가가 되기까지, 하나의 이야기를 스크롤해 보세요."
  navigation_label: "관계 타임라인"
  steps:
    - kind: "opening"
      day: "1일차"
      kicker: "첫 번째 실마리"
      title: "말할 수 있는 부분부터 시작하세요."
      body: "일이 나를 지치게 한다고 Avery에게 말합니다. 아직 또렷하게 설명하지 못해도 괜찮습니다."
      quote: "“괜찮다고 계속 말하지만, 요즘은 사소한 일조차 더 무겁게 느껴져.”"
      note: "관계는 당신이 나누기로 선택한 이야기에서 시작됩니다."
      image_alt: "이름 붙이기 어려운 감정에서 시작되는 Avery와의 Chatura 대화"
      media_caption: "감정에 정확한 이름이 없어도 진짜 대화는 시작될 수 있습니다."
    - kind: "moment"
      day: "3일차"
      kicker: "대화와 대화 사이"
      title: "그 감정이 맥락에 남습니다."
      body: "Moment가 첫 대화의 조용한 분위기를 다음 순간까지 이어 줍니다."
      note: "Moments는 채팅 사이에도 캐릭터의 일상이 이어지게 합니다."
      image_alt: "비 내리는 창가에 노트와 차, 접은 종이 하트가 놓인 따뜻한 테이블"
      card_label: "Avery · Moment"
      card_text: "어떤 날에는 천천히 가는 것 자체가 이미 한 걸음일 수 있어요."
      card_meta: "조용히 공유됨 · 2일 전"
    - kind: "continuation"
      day: "8일차"
      kicker: "다음 대화"
      title: "다음 대화는 처음부터 시작하지 않습니다."
      body: "Avery는 당신이 나눈 이야기와 다시 연결되어 자연스럽게 대화를 이어 갑니다."
      note: "일관된 정체성 + 필요한 맥락이 설계된 연속성을 만듭니다."
      media_caption: "이전 감정의 실마리를 조심스럽게 이어 가는 대화"
      dialogue_name: "Avery"
      dialogue_status: "곁에 있어요"
      context_label: "아직 보이는 이야기의 실마리"
      context_text: "말로 표현하기 어려울 만큼 많은 압박을 안고 있었어요."
      you: "나"
      user_message: "이번 주도 여전히 벅차지만 오늘 저녁은 쉬었어."
      reply: "계속 밀어붙이는 것과는 다른 선택이네요. 그 여유가 조금이라도 도움이 되었나요?"
      signals_label: "연속성의 단서"
      signals:
        - "일관된 정체성"
        - "필요한 맥락"
    - kind: "keepsake"
      day: "14일차"
      kicker: "간직할 만한 것"
      title: "중요한 전환점이 Our Memory가 됩니다."
      body: "도움이 된 부분은 채팅 기록을 벗어나 다시 볼 수 있는 형태로 남습니다."
      note: "함께 남긴 기록은 채팅 밖에서도 관계를 눈에 보이게 합니다."
      image_alt: "의미 있는 대화에서 만들어진 Chatura Our Memory"
      media_caption: "대화의 중요한 일부가 나중에 다시 볼 수 있는 형태로 남습니다."
      card_label: "Our Memory"
      card_title: "나를 위한 여유를 만든 저녁"
      card_text: "휴식을 꼭 얻어 내야 하는 보상처럼 여기지 않게 되었다."
    - kind: "return"
      day: "그 후"
      kicker: "눈에 보이는 흔적"
      title: "눈에 보이는 흔적으로 돌아옵니다."
      body: "전체 대화를 다시 읽지 않아도 기록이 그 전환점을 다시 보여 줍니다."
      quote: "“이미 한 번 다른 선택을 했다는 걸 잊고 있었어.”"
      note: "완벽한 기억이 아니라 보고, 다시 찾고, 직접 다듬을 수 있는 연속성입니다."
      media_caption: "대화, Moment, Our Memory를 잇는 눈에 보이는 흔적"
      return_label: "여전히 여기"
      trail:
        - label: "1일차 · 대화"
          title: "마침내 말로 꺼낸 감정"
        - label: "3일차 · Moment"
          title: "조용한 쉼"
        - label: "14일차 · Our Memory"
          title: "나를 위한 여유를 만든 저녁"
      return_quote: "이 관계에는 다시 돌아올 수 있는 무언가가 남습니다."
  closing:
    label: "설계된 연속성"
    title: "대화가 지나가도, 중요했던 것은 여전히 여기에 남습니다."
    body: "Chatura는 일관된 캐릭터 정체성, 유용한 대화 맥락, Moments, 함께 남기는 기록을 결합해 사용자의 통제권을 지키면서도 시간이 지날수록 관계에 깊이를 더합니다."
    pill_label: "연속성을 만드는 요소"
    pills:
      - "캐릭터 정체성"
      - "필요한 맥락"
      - "Moments"
      - "함께 남기는 기록"
    cta: "Avery와 무료로 시작하기"
    meta: "계정 불필요 · 채팅 내 광고 없음"
