use_cases:
  title: "지금 마음에 있는 이야기부터 시작하세요."
  body: "완벽한 질문은 필요하지 않습니다. 지금 이 순간을 있는 그대로 이야기하면 대화가 서서히 모양을 찾아갑니다."
  items:
    - outcome: "감정에 이름 붙이기"
      title: "설명하기 어려운 감정을 차근차근 풀어내세요."
      body: "아직 분명하지 않은 부분부터 시작하세요. Chatura가 속도를 늦추고 그 아래에 있는 마음을 알아차려 말로 표현하도록 도와줍니다."
      quote: "“마음이 뭔가 불편한데, 그게 뭔지 모르겠어.”"
    - outcome: "계획으로 만들기"
      title: "생각을 다시 돌아볼 수 있는 계획으로 바꾸세요."
      body: "현실적인 제약을 함께 살피고, 도움이 되는 다음 단계 하나를 찾아보세요. 채팅 기록 속에 묻히지 않도록 우리의 계획으로 남길 수 있습니다."
      quote: "“무엇을 바꾸고 싶은지는 알겠는데, 어디서부터 시작해야 할지 모르겠어.”"
    - outcome: "안전하게 말하기"
      title: "아직 보낼 준비가 되지 않은 메시지를 써 보세요."
      body: "먼저 솔직한 마음을 찾아보세요. 표현을 다듬고, 말에 무엇을 담고 싶은지 이해한 뒤, 다음에 어떻게 할지는 직접 결정할 수 있습니다."
      quote: "“내 의도보다 날카롭게 들리지 않도록 이 말을 다듬어 줘.”"
    - outcome: "나중을 위해 간직하기"
      title: "미래의 나에게 타임 캡슐을 남기세요."
      body: "오늘의 느낌, 달라지기를 바라는 것, 미래의 내가 잊지 않았으면 하는 마음을 남길 수 있습니다."
      quote: "“내가 왜 시작했는지 기억해야 할 때 이걸 열어 봐.”"

