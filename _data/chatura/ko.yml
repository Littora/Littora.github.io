faq:
  title: "자주 묻는 질문"
  items:
    - question: "Chatura는 일반적인 AI 채팅 앱과 무엇이 다른가요?"
      answer: "Chatura는 채팅이 끝난 뒤에도 의미가 이어지는 일상의 동반자 대화를 위해 만들어졌습니다. 대화의 중요한 부분은 우리의 기억, 우리의 계획, 소망의 목소리, 타임 캡슐, 비밀 안식처가 되어 나중에 다시 돌아볼 수 있습니다."
    - question: "대화에서 무엇을 간직할 수 있나요?"
      answer: "유용하거나 개인적이거나 다시 돌아볼 가치가 있는 순간을 우리의 기억, 우리의 계획, 소망의 목소리, 타임 캡슐, 비밀 안식처로 남길 수 있습니다. 별도의 메모나 계획 과정을 거치지 않고, 채팅 중에 자연스럽게 만들어집니다."
    - question: "캐릭터는 시간이 지나면서 어떻게 더 친밀하게 느껴지나요?"
      answer: "각 동반자는 고유한 말투, 정체성, 내면 세계를 지닙니다. 대화를 계속할수록 Chatura는 유용한 맥락을 다음 대화로 이어, 이후의 대화가 더 자연스럽게 연결되도록 합니다."
    - question: "Chatura를 무료로 시작할 수 있나요?"
      answer: "네. 계정을 만들지 않고 시작해 Chatura의 핵심 캐릭터를 무료로 체험할 수 있습니다. 앱에서 선택형 구독 기능도 이용할 수 있습니다."
    - question: "Chatura는 개인정보를 보호하고 직접 관리하기 쉬운가요?"
      answer: "Chatura에는 채팅 광고, 앱 간 추적, 타사 분석 SDK가 없습니다. 대화를 삭제하거나 채팅 데이터를 내보낼 수 있습니다. AI 답변은 백엔드와 모델 서비스를 통해 생성되므로, 답변을 요청할 때 필요한 대화 맥락이 처리될 수 있습니다."

