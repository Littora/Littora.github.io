use_cases:
  title: "Commencez par ce que vous avez déjà en tête."
  body: "Nul besoin de trouver la bonne consigne. Partez du moment tel qu’il est et laissez la conversation prendre forme."
  items:
    - outcome: "Le nommer"
      title: "Démêlez une émotion difficile à expliquer."
      body: "Commencez par ce qui reste flou. Chatura peut vous aider à ralentir, à discerner ce qui se trouve derrière et à le mettre en mots."
      quote: "« Quelque chose ne va pas, mais je n’arrive pas à dire quoi. »"
    - outcome: "Le structurer"
      title: "Transformez une pensée en projet auquel revenir."
      body: "Examinez les contraintes réelles, trouvez une prochaine étape utile et conservez le résultat dans Nos projets plutôt que de le perdre dans l’historique."
      quote: "« Je sais ce que je veux changer. Je ne sais simplement pas par où commencer. »"
    - outcome: "Le dire en confiance"
      title: "Écrivez le message que vous n’êtes pas encore prêt à envoyer."
      body: "Trouvez d’abord la version sincère. Vous pourrez affiner les mots, comprendre ce qu’ils doivent transmettre et décider de la suite."
      quote: "« Aidez-moi à le dire sans être plus dur que je ne le souhaite. »"
    - outcome: "Le garder pour plus tard"
      title: "Laissez une Capsule temporelle à votre futur vous."
      body: "Gardez ce que cette journée vous fait ressentir, ce que vous espérez voir changer ou ce que votre futur vous ne doit pas oublier."
      quote: "« Ouvre ceci quand j’aurai besoin de me rappeler pourquoi j’ai commencé. »"

