faq:
  title: "FAQ"
  items:
    - question: "En quoi Chatura se distingue-t-il d’une app de chat IA classique ?"
      answer: "Chatura est pensé pour les conversations quotidiennes avec un compagnon qui peuvent continuer à compter une fois le chat terminé. Les passages importants peuvent devenir des Souvenirs, des Projets, des Souhaits, des Capsules temporelles et des Secrets à retrouver plus tard."
    - question: "Que puis-je garder de mes conversations ?"
      answer: "Vous pouvez garder les moments utiles, personnels ou dignes d’être retrouvés sous la forme de Notre mémoire, Nos projets, Voix des souhaits, Capsule temporelle et Refuge secret. Ils se créent naturellement dans le chat, sans passer par un outil distinct de notes ou de planification."
    - question: "Comment les personnages deviennent-ils plus personnels avec le temps ?"
      answer: "Chaque compagnon possède un ton, une identité et un monde intérieur distincts. Au fil des échanges, Chatura peut conserver le contexte utile afin que les conversations suivantes paraissent plus continues."
    - question: "Puis-je commencer à utiliser Chatura gratuitement ?"
      answer: "Oui. Vous pouvez commencer sans créer de compte et essayer gratuitement le personnage principal de Chatura. Des fonctionnalités facultatives sur abonnement sont proposées dans l’app."
    - question: "Chatura respecte-t-il ma vie privée et me laisse-t-il le contrôle ?"
      answer: "Chatura n’affiche aucune publicité dans le chat, n’effectue aucun suivi entre les apps et n’utilise aucun SDK d’analyse tiers. Vous pouvez supprimer vos conversations ou exporter vos données de chat. Les réponses IA sont générées par des services dorsaux et des modèles ; le contexte nécessaire de la conversation peut donc être traité lorsque vous demandez une réponse."

