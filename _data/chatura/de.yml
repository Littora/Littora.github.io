  details: "Starte ohne Konto. Chatte ohne Werbung. Wähle eine bewusst gestaltete Begleitung und verwandle bedeutungsvolle Momente in Erinnerungen, Pläne, Wünsche, Zeitkapseln und Geheimnisse, zu denen du zurückkehren kannst, wenn sie wieder wichtig werden."
  highlights_label: "Chatura auf einen Blick"
