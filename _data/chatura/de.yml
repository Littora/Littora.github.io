use_cases:
  title: "Beginne mit dem, was dich bereits beschäftigt."
  body: "Du brauchst keine perfekte Eingabe. Beginne mit dem Moment, wie er ist, und lass das Gespräch seine Form finden."
  items:
    - outcome: "Benennen"
      title: "Entwirre ein Gefühl, das du kaum erklären kannst."
      body: "Beginne mit dem Teil, der unklar bleibt. Chatura kann dir helfen, langsamer hinzuschauen, das Darunterliegende zu erkennen und Worte dafür zu finden."
      quote: "„Etwas fühlt sich nicht richtig an, aber ich kann nicht sagen, was.“"
    - outcome: "Gestalten"
      title: "Mach aus einem Gedanken einen Plan, zu dem du zurückkehren kannst."
      body: "Besprich die tatsächlichen Rahmenbedingungen, finde einen hilfreichen nächsten Schritt und bewahre das Ergebnis unter «Unsere Pläne», statt es im Chatverlauf zu verlieren."
      quote: "„Ich weiss, was ich ändern möchte. Ich weiss nur nicht, wo ich anfangen soll.“"
    - outcome: "Sicher aussprechen"
      title: "Schreibe die Nachricht, die du noch nicht senden möchtest."
      body: "Finde zuerst die ehrliche Fassung. Du kannst die Worte verfeinern, verstehen, was sie vermitteln sollen, und dann über den nächsten Schritt entscheiden."
      quote: "„Hilf mir, das zu sagen, ohne schärfer zu klingen, als ich es meine.“"
    - outcome: "Für später bewahren"
      title: "Hinterlasse deinem zukünftigen Ich eine Zeitkapsel."
      body: "Bewahre, wie sich der heutige Tag anfühlt, was sich hoffentlich verändert oder was dein zukünftiges Ich nicht vergessen soll."
      quote: "„Öffne das, wenn ich mich daran erinnern muss, warum ich angefangen habe.“"

