faq:
  title: "FAQ"
  items:
    - question: "Wie unterscheidet sich Chatura von einer typischen KI-Chat-App?"
      answer: "Chatura ist für alltägliche Gespräche mit einer Begleitung gemacht, die auch nach dem Ende des Chats wichtig bleiben können. Bedeutungsvolle Teile eines Gesprächs können zu Erinnerungen, Plänen, Wünschen, Zeitkapseln und Geheimnissen werden, zu denen du später zurückkehrst."
    - question: "Was kann ich aus meinen Gesprächen bewahren?"
      answer: "Du kannst nützliche, persönliche oder erinnerungswerte Momente als «Unsere Erinnerungen», «Unsere Pläne», «Wunschstimmen», «Zeitkapseln» und im «Geheimen Rückzugsort» festhalten. Sie entstehen ganz natürlich im Chat und nicht in einem separaten Notiz- oder Planungssystem."
    - question: "Wie fühlen sich die Figuren mit der Zeit persönlicher an?"
      answer: "Jede Begleitung hat eine eigene Tonlage, Identität und innere Welt. Während ihr weiterredet, kann Chatura hilfreichen Kontext übernehmen, damit sich spätere Gespräche zusammenhängender anfühlen."
    - question: "Kann ich Chatura kostenlos nutzen?"
      answer: "Ja. Du kannst ohne Konto starten und die zentrale Figur von Chatura kostenlos ausprobieren. Optionale Funktionen im Abonnement sind in der App verfügbar."
    - question: "Ist Chatura privat und einfach zu kontrollieren?"
      answer: "Chatura hat keine Werbung im Chat, kein app-übergreifendes Tracking und keine Analyse-SDKs von Drittanbietern. Du kannst Gespräche löschen oder deine Chatdaten exportieren. KI-Antworten werden über Backend- und Modelldienste erzeugt. Deshalb kann der notwendige Gesprächskontext verarbeitet werden, wenn du eine Antwort anforderst."

