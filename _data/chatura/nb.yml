  tagline: "Snakk om det. Ta vare på det som betyr noe."
  intro: "Chatura er en KI-følgesvenn for hverdagen og for samtalene du ikke vil miste i chathistorikken: å sette ord på en følelse, avklare neste steg, formulere et ønske eller ta vare på en tanke til senere."
  details: "Start uten konto. Chat uten annonser. Velg en følgesvenn som er utformet med omtanke, og la meningsfulle øyeblikk bli til Minner, Planer, Ønsker, Tidskapsler og Hemmeligheter du kan vende tilbake til når de betyr noe igjen."
  highlights_label: "Høydepunkter i Chatura"
