faq:
  title: "Vanlige spørsmål"
  items:
    - question: "Hva skiller Chatura fra en vanlig KI-chatapp?"
      answer: "Chatura er laget for hverdagssamtaler med en følgesvenn som kan fortsette å bety noe etter at chatten er avsluttet. Meningsfulle deler av en samtale kan bli til Minner, Planer, Ønsker, Tidskapsler og Hemmeligheter du kan vende tilbake til senere."
    - question: "Hva kan jeg ta vare på fra samtalene mine?"
      answer: "Du kan ta vare på nyttige, personlige øyeblikk eller ting du vil vende tilbake til, som Minnene våre, Planene våre, Ønskestemmer, Tidskapsler og Hemmelig fristed. De skapes naturlig i chatten, ikke gjennom en separat arbeidsflyt for notater eller planlegging."
    - question: "Hvordan føles figurene mer personlige over tid?"
      answer: "Hver følgesvenn har sin egen tone, identitet og indre verden. Etter hvert som dere fortsetter å chatte, kan Chatura ta med nyttig kontekst videre, slik at senere samtaler føles mer sammenhengende."
    - question: "Kan jeg begynne å bruke Chatura gratis?"
      answer: "Ja. Du kan starte uten å opprette en konto og prøve hovedfiguren i Chatura gratis. Valgfrie abonnementsfunksjoner er tilgjengelige i appen."
    - question: "Er Chatura privat og lett å kontrollere?"
      answer: "Chatura har ingen annonser i chatten, ingen sporing på tvers av apper og ingen analyse-SDK-er fra tredjeparter. Du kan slette samtaler eller eksportere chatdataene dine. KI-svar genereres gjennom backend- og modelltjenester, så nødvendig samtalekontekst kan bli behandlet når du ber om et svar."

