use_cases:
  title: "Begynn med det du allerede har i tankene."
  body: "Du trenger ikke den perfekte formuleringen. Begynn med øyeblikket slik det er, og la samtalen finne formen sin."
  items:
    - outcome: "Sett navn på det"
      title: "Løs opp i en følelse du ikke helt klarer å forklare."
      body: "Begynn med den delen som føles uklar. Chatura kan hjelpe deg å roe ned, legge merke til hva som ligger under og sette ord på det."
      quote: "«Noe føles galt, men jeg klarer ikke å si hva.»"
    - outcome: "Gi det form"
      title: "Gjør en tanke til en plan du kan vende tilbake til."
      body: "Snakk gjennom de virkelige begrensningene, finn ett nyttig neste steg og ta vare på resultatet i Planene våre i stedet for å miste det i chathistorikken."
      quote: "«Jeg vet hva jeg vil endre. Jeg vet bare ikke hvor jeg skal begynne.»"
    - outcome: "Si det trygt"
      title: "Skriv meldingen du ikke er klar til å sende."
      body: "Finn den ærlige versjonen først. Du kan finpusse ordene, forstå hva du vil at de skal bære med seg, og bestemme hva som skjer videre."
      quote: "«Hjelp meg å si dette uten at det blir skarpere enn jeg mener.»"
    - outcome: "Ta vare på det til senere"
      title: "Legg igjen en Tidskapsel til ditt fremtidige jeg."
      body: "Ta vare på hvordan dagen føles, hva du håper vil endre seg, eller hva du ikke vil at ditt fremtidige jeg skal glemme."
      quote: "«Åpne dette når jeg trenger å huske hvorfor jeg begynte.»"

