faq:
  title: "FAQ"
  items:
    - question: "In cosa Chatura è diversa da una tipica app di chat IA?"
      answer: "Chatura è pensata per le conversazioni quotidiane con un compagno che possono continuare a contare anche dopo la fine della chat. Le parti significative possono diventare Ricordi, Piani, Desideri, Capsule del tempo e Segreti a cui tornare in seguito."
    - question: "Cosa posso conservare delle mie conversazioni?"
      answer: "Puoi conservare i momenti utili, personali o degni di essere rivissuti come «La nostra memoria», «I nostri piani», «Voci dei desideri», «Capsule del tempo» e «Rifugio segreto». Nascono naturalmente dalla chat, senza un flusso separato per note o pianificazione."
    - question: "In che modo i personaggi diventano più personali nel tempo?"
      answer: "Ogni compagno ha un tono, un’identità e un mondo interiore distinti. Continuando a chattare, Chatura può portare avanti il contesto utile, così le conversazioni successive risultano più continue."
    - question: "Posso iniziare a usare Chatura gratuitamente?"
      answer: "Sì. Puoi iniziare senza creare un account e provare gratuitamente il personaggio principale di Chatura. Nell’app sono disponibili funzionalità opzionali in abbonamento."
    - question: "Chatura tutela la privacy ed è facile da controllare?"
      answer: "Chatura non mostra pubblicità nella chat, non effettua tracciamento tra app e non usa SDK di analisi di terze parti. Puoi eliminare le conversazioni o esportare i dati della chat. Le risposte IA vengono generate tramite servizi backend e modelli, quindi il contesto necessario della conversazione può essere elaborato quando chiedi una risposta."

