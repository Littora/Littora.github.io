use_cases:
  title: "Inizia da ciò che hai già in mente."
  body: "Non serve la richiesta perfetta. Parti dal momento così com’è e lascia che la conversazione trovi la sua forma."
  items:
    - outcome: "Dagli un nome"
      title: "Districa un’emozione che non riesci a spiegare del tutto."
      body: "Inizia dalla parte che resta poco chiara. Chatura può aiutarti a rallentare, riconoscere ciò che c’è sotto e metterlo in parole."
      quote: "«Qualcosa non va, ma non riesco a capire cosa.»"
    - outcome: "Dagli forma"
      title: "Trasforma un pensiero in un piano a cui tornare."
      body: "Parla dei vincoli reali, trova un prossimo passo utile e conserva il risultato nella sezione «I nostri piani» invece di perderlo nella cronologia."
      quote: "«So cosa voglio cambiare. Semplicemente non so da dove iniziare.»"
    - outcome: "Dillo con calma"
      title: "Scrivi il messaggio che non sei ancora pronto a inviare."
      body: "Trova prima la versione sincera. Puoi affinare le parole, capire cosa vuoi che trasmettano e decidere cosa fare dopo."
      quote: "«Aiutami a dirlo senza sembrare più duro di quanto intendo.»"
    - outcome: "Conservalo per dopo"
      title: "Lascia una Capsula del tempo al tuo io futuro."
      body: "Conserva come ti senti oggi, ciò che speri possa cambiare o ciò che non vuoi che il tuo io futuro dimentichi."
      quote: "«Apri questo quando avrò bisogno di ricordare perché ho iniziato.»"

