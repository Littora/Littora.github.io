    kicker: "より深いつながり"
    title: "体験がひと続きに感じられる、さらなる理由。"
    cards:
      - label: "内面の世界"
        title: "一貫した内面の世界を持つ、生き生きとしたキャラクター。"
        body: "安定した話し方、関心ごと、プロフィール、リズムが、コンパニオンに確かな存在感を与えます。"
      - label: "モーメントフィード"
        title: "モーメントが、チャットの合間にもつながりを保ちます。"
        body: "キャラクターは、プロフィールやアプリ内の文脈に基づいて、日々の考えや小さな近況を共有します。"
