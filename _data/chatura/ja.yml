  keepsakes:
    kicker: "残しておきたいチャット"
    title: "チャットが、また戻ってきたいものになる。"
    body: "気持ち、決断、願い、未来へのメモ。大切な内容はチャットから「記憶」「計画」「願いの声」「タイムカプセル」「秘密の隠れ家」へ移し、必要なときにまた振り返れます。"
    label: "Chaturaの会話が、あとから振り返れる大切な記録になる様子"
    chat:
      - speaker: "user"
        text: "この考えを忘れたくない。"
      - speaker: "companion"
        text: "では、大切なところを残しておきましょう。"
      - speaker: "user"
        text: "ただのメッセージ以上に感じた。"
      - speaker: "companion"
        text: "あとから振り返れる形にできますよ。"
      - speaker: "user"
        text: "また戻ってこられるものにして。"
    items:
      - kind: "memory"
        name: "私たちの記憶"
        summary: "その瞬間を見える形で残す"
      - kind: "plan"
        name: "私たちの計画"
        summary: "次の一歩を未来へつなぐ"
      - kind: "wish"
        name: "願いの声"
