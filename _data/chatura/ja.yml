use_cases:
  title: "今、心にあることから始めましょう。"
  body: "完璧な問いかけは必要ありません。その瞬間をありのまま話せば、会話が少しずつ形を見つけていきます。"
  items:
    - outcome: "気持ちに名前をつける"
      title: "うまく説明できない気持ちをほどく。"
      body: "まだはっきりしないところから始めてください。Chaturaは、立ち止まってその奥にあるものに気づき、言葉にするお手伝いをします。"
      quote: "「何かが引っかかっているけれど、それが何なのかわからない。」"
    - outcome: "形にする"
      title: "考えを、あとから戻れる計画に変える。"
      body: "現実的な条件を一緒に整理し、役に立つ次の一歩を見つけましょう。会話の中に埋もれさせず、「私たちの計画」として残せます。"
      quote: "「変えたいことはわかっている。でも、どこから始めればいいかわからない。」"
    - outcome: "安心して言葉にする"
      title: "まだ送る準備ができていないメッセージを書く。"
      body: "まずは率直な気持ちを言葉にしましょう。伝えたいことを見つめ、表現を整えて、その次をどうするかは自分で決められます。"
      quote: "「きつく聞こえすぎないように、この気持ちを伝えるのを手伝って。」"
    - outcome: "未来に残す"
      title: "未来の自分へタイムカプセルを残す。"
      body: "今日をどう感じているか、何が変わってほしいか、未来の自分に忘れてほしくないことを残せます。"
      quote: "「始めた理由を思い出したいときに、これを開いて。」"

