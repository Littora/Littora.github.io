    title: "眺めるためのキャラクター一覧ではなく、また会いたくなるコンパニオン。"
    body: "Chaturaはコンパニオンとの関係を大切に設計しています。選択肢を絞り、個性を明確にすることで、自然とまた話したくなる体験をつくります。"
    label: "丁寧に設計されたChaturaコンパニオンのプロフィール"
    profile_label: "コンパニオンプロフィール"
    profile_title: "一貫した内面の世界"
    status: "いつでも話せます"
    details:
      - label: "話し方"
        value: "あたたかく、安定し、率直"
      - label: "リズム"
        value: "始めやすく、戻りやすい"
      - label: "文脈"
        value: "あなたが話したことを受け継ぐ"
    tones_label: "Chaturaコンパニオンの雰囲気"
