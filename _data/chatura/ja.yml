hero:
  tagline: "話して整理する。大切なものを残す。"
  intro: "Chaturaは、チャット履歴の中に埋もれさせたくない会話のための、日常に寄り添うAIコンパニオンです。気持ちに名前をつけること、次の一歩を整理すること、願いを言葉にすること、あとで振り返りたい考えを残すこと。"
  details: "アカウントなしですぐに始められ、チャットに広告はありません。丁寧に設計されたコンパニオンを選び、大切な瞬間を「私たちの記憶」「私たちの計画」「願いの声」「タイムカプセル」「秘密の隠れ家」として、必要なときに振り返れます。"
  highlights_label: "Chaturaの特長"
