  title: "一緒に話してみませんか？"
  body: "無料で始められます。アカウント不要。チャットに広告はありません。"

faq:
  title: "よくある質問"
  items:
    - question: "Chaturaは一般的なAIチャットアプリと何が違いますか？"
      answer: "Chaturaは、チャットが終わったあとも意味を持ち続ける、日常のコンパニオンとの会話のために作られています。会話の大切な部分を「記憶」「計画」「願いの声」「タイムカプセル」「秘密の隠れ家」として残し、あとから振り返れます。"
    - question: "会話から何を残せますか？"
      answer: "役に立つこと、個人的なこと、また振り返りたい瞬間を「私たちの記憶」「私たちの計画」「願いの声」「タイムカプセル」「秘密の隠れ家」として残せます。別のメモや計画ツールを使うのではなく、普段のチャットから自然に作られます。"
    - question: "キャラクターは時間とともにどのように親しみやすくなりますか？"
      answer: "それぞれのコンパニオンには、独自の雰囲気、個性、内面の世界があります。会話を重ねると、Chaturaは役立つ文脈を次の会話へ引き継ぎ、より自然なつながりを生み出します。"
    - question: "Chaturaは無料で使い始められますか？"
      answer: "はい。アカウントを作成せずに始められ、Chaturaの中心となるキャラクターを無料で試せます。アプリ内には任意のサブスクリプション機能もあります。"
    - question: "Chaturaはプライバシーを守り、自分で管理しやすいですか？"
      answer: "Chaturaにはチャット広告、アプリをまたぐトラッキング、第三者の解析SDKがありません。会話の削除やチャットデータの書き出しも可能です。AIの返信はバックエンドとモデルサービスを通じて生成されるため、返信を求めた際には必要な会話の文脈が処理される場合があります。"

