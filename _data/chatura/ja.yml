  lede: "Chaturaは、終わりのない一覧から選ばせるのではなく、ひとりの中心的なコンパニオンとの関係から始まります。何でも大丈夫なふりはせず、あたたかく。問い詰めることなく、好奇心を持って。考えがほどけるまで、穏やかに寄り添います。"
  principles:
