title: Littora
tagline: The Study of Human Feeling
description: Where feeling is held, explored, and brought into form
theme: minima

# User site typically uses baseurl empty.
baseurl: ""
url: "https://littora.art"

# Optional (helps accessibility and SEO)
lang: en-US

# Markdown engine (default is fine, but explicit is clearer)
markdown: kramdown

# Generate a canonical XML sitemap for search engine discovery.
plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      favicon: /assets/icons/littora-icon.png
      apple_touch_icon: /assets/icons/littora-icon.png
      share_image: /assets/icons/littora-icon.png
      share_image_width: 1254
      share_image_height: 1254
      share_image_alt: Littora icon
  - scope:
      path: "apps/chatura"
      type: "pages"
    values:
      favicon: /assets/icons/chatura-icon.png
      apple_touch_icon: /assets/icons/chatura-icon.png
      share_image: /assets/icons/chatura-icon.png
      share_image_width: 1024
      share_image_height: 1024
      share_image_alt: Chatura app icon
  - scope:
      path: "apps/yonderkin"
      type: "pages"
    values:
      layout: yonderkin
      lang: en-US
      yonderkin_page: true
      favicon: /assets/yonderkin/yonderkin-icon.png
      apple_touch_icon: /assets/yonderkin/yonderkin-icon.png
      share_image: /assets/yonderkin/universe-hero.jpg
      share_image_type: image/jpeg
      share_image_width: 1800
      share_image_height: 981
      share_image_alt: Yonderkin universe
  - scope:
      path: "apps/momentlet"
      type: "pages"
    values:
      layout: momentlet
      lang: en-US
      momentlet_page: true
      favicon: /assets/momentlet/momentlet-icon.png
      apple_touch_icon: /assets/momentlet/momentlet-icon.png
      share_image: /assets/momentlet/moment-keepsake.jpg
      share_image_type: image/jpeg
      share_image_width: 1448
      share_image_height: 1086
      share_image_alt: A Momentlet keepsake showing a quiet coastal morning
  - scope:
      path: "apps/cuddavi"
      type: "pages"
    values:
      layout: cuddavi
      lang: en-US
      cuddavi_page: true
      favicon: /assets/cuddavi/cuddavi-icon.png
      apple_touch_icon: /assets/cuddavi/cuddavi-icon.png
      share_image: /assets/cuddavi/cuddavi-cosmos-v2.png
      share_image_type: image/png
      share_image_width: 1672
      share_image_height: 941
      share_image_alt: Five Cuddavi companions together in a bright universe
