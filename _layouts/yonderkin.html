<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body class="yonderkin-site">
    {% include header.html %}
    {% if page.yonderkin_home %}
      {{ content }}
    {% else %}
      <main id="main-content" class="page-content" aria-label="Content">
        <div class="wrapper">
          {{ content }}
        </div>
      </main>
    {% endif %}
    {% include yonderkin-footer.html %}
  </body>
</html>
