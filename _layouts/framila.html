<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" class="fm-root">
  {% include framila-head.html %}
  <body class="fm-site{% unless page.framila_home %} fm-site--document{% endunless %}">
    <a class="fm-skip" href="#main-content">Skip to content</a>
    {% include framila-header.html %}
    {% if page.framila_home %}
      {{ content }}
    {% else %}
      <main id="main-content" class="fm-document fm-shell">
        <a class="fm-text-link fm-back" href="{{ site.data.framila.app.site_path | relative_url }}"><span aria-hidden="true">←</span> Framila home</a>
        <article>{{ content }}</article>
      </main>
    {% endif %}
    {% include framila-footer.html %}
  </body>
</html>
