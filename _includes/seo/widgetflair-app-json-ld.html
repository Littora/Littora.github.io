{% assign app = site.data.widgetflair.app %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": {{ app.name | jsonify }},
  "url": {{ app.site_path | absolute_url | jsonify }},
  "image": {{ app.icon | absolute_url | jsonify }},
  "description": {{ page.description | jsonify }},
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "iOS 17 or later",
  "availableOnDevice": "iPhone",
  "inLanguage": ["en", "de", "fr", "it", "ja", "ko", "nb"],
  "author": {"@type": "Organization", "name": "Littora", "url": {{ '/' | absolute_url | jsonify }}},
  "featureList": ["Offline widget creation and use", "Home Screen and compatible Lock Screen widgets", "Customizable color palettes", "Clocks, calendars, reading progress, gratitude, habits, moods and playful widgets", "Free designs and free previews of the full collection", "New Premium designs included while subscribed", "Saved widgets remain usable and editable after a subscription ends"]
}
</script>
