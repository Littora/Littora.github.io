{% assign app = site.data.pickkin.app %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6ee">
  {% seo %}
  {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <link rel="icon" type="image/png" href="{{ '/assets/pickkin/pickkin-favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ app.share_image | relative_url }}">
  <meta property="og:image" content="{{ app.share_image | absolute_url }}">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="Pickkin app icon">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="{{ app.share_image | absolute_url }}">
  <meta name="twitter:image:alt" content="Pickkin app icon">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <link rel="preload" href="{{ '/assets/fonts/DMSans-Variable.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/BricolageGrotesque-Variable.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/pickkin.css' | relative_url }}">
  <script src="{{ '/assets/pickkin-home.js' | relative_url }}" defer></script>
  {% if page.pickkin_home %}{% include seo/pickkin-app-json-ld.html %}{% endif %}
</head>
