{% assign copy = site.data.cuddavi.en %}
<dialog class="cuddavi-dialog" data-cuddavi-dialog aria-labelledby="cuddavi-dialog-title">
  <button class="cuddavi-dialog__dismiss" type="button" aria-label="Close download message" data-cuddavi-dialog-close>Close</button>
  <img src="{{ '/assets/cuddavi/cuddavi-icon.png' | relative_url }}" width="76" height="76" alt="Cuddavi app icon">
  <p class="cuddavi-eyebrow">Cuddavi for iPhone</p>
  <h2 id="cuddavi-dialog-title">{{ copy.download_modal.title }}</h2>
  <p>{{ copy.download_modal.body }}</p>
  <div class="cuddavi-dialog__actions">
    <button class="cuddavi-button cuddavi-button--primary" type="button" data-cuddavi-dialog-close>{{ copy.download_modal.close }}</button>
    <a href="mailto:{{ site.data.cuddavi.app.support_email }}?subject=Cuddavi%20Support">{{ copy.download_modal.support }}</a>
  </div>
</dialog>
