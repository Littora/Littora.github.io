{% assign app = site.data.widgetflair.app %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbf4">
  {% seo %}
  {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <link rel="icon" type="image/png" href="{{ '/assets/widgetflair/widgetflair-favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/widgetflair/widgetflair-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/BricolageGrotesque-Variable.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/DMSans-Variable.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/widgetflair.css' | relative_url }}">
  <script src="{{ '/assets/widgetflair-home.js' | relative_url }}" defer></script>
  {% if page.widgetflair_home %}{% include seo/widgetflair-app-json-ld.html %}{% endif %}
</head>
