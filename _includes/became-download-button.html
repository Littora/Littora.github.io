{% assign app = site.data.became.app %}
{% capture button_content %}{% if include.compact %}Download <span aria-hidden="true">↗</span>{% else %}<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M10 19h4"/></svg><span><small>Download for</small><strong>iPhone</strong></span><span class="bc-download__arrow" aria-hidden="true">↗</span>{% endif %}{% endcapture %}
{% if app.app_store_url != '' %}
  <a class="bc-download{% if include.compact %} bc-download--compact{% endif %}" href="{{ app.app_store_url | escape }}" target="_blank" rel="noopener" aria-label="Download Became on the App Store">{{ button_content }}</a>
{% else %}
  <button class="bc-download{% if include.compact %} bc-download--compact{% endif %}" type="button" data-bc-download aria-label="Download Became for iPhone">{{ button_content }}</button>
{% endif %}
